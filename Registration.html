    <!--Registration form with text field ,email,tel, date, checkbox , radio and submit.-->

    <h1>Registration Form</h1>

    <form action="registration.php" method="post" id="regform">
        <label for="sname">*Surname:</label>
        <input type="text" id="sname" name="Surname" maxlength="50" required>  

        <label for="oname">Other names:</label>
        <input type="text" id="oname" name="othername" maxlength="100" required> <br><br>

        <label for="email">*Email:</label>
        <input type="email" id="email" name="Email" maxlength="200" required> <br><br>

        <label for="mphone">*Mobile number: </label>
        <input type="tel" id="mphone" name="Mobile" maxlength="20" placeholder="+254 712 345 678"> <br><br>

        <label>*Select your date of birth</label> <br>
        <input type="date" id="date" name="date" required> <br><br>

        <label>*Which activities would you like to sign up for?</label> <br>

        <label>
            <input type="checkbox" name="Activities[]" value="Gym" >
            Gym
        </label> <br>

        <label>
            <input type="checkbox" name="Activities[]" value="Pilates">
            Pilates
        </label> <br>

        <label>
            <input type="checkbox" name="Activities[]" value="Aerobics">
            Aerobics
        </label> <br>

        <label>
            <input type="checkbox" name="Activities[]" value="Aquaerobics">
            Aqua-Aerobics
        </label> <br><br>

        <label>*What is your preferred workout time?</label> <br>

        <label>
        <input type="radio" id="emtime" name="Time" value="Early morning" required>
        Early morning  (5:00am - 9:00am)
        </label> <br>

        <label>
        <input type="radio" id="mmtime" name="Time" value="Mid morning">
         Mid morning  (9:00am - 12:00am)
        </label> <br>

        <label>
        <input type="radio" id="atime" name="Time" value="Afternoon">
        Afternoon  (12:00am - 4:00am)
        </label> <br>

        <label>
        <input type="radio" id="etime" name="Time" value="Evening">
        Evening  (4:00pm - 7:30pm)
        </label> <br>

        <label>
        <input type="radio" id="ntime" name="Time" value="Night">
        Night  (7:30pm - 10:30pm)
        </label> <br><br>

        <label for="ucond">Do you have any medical conditions we should take to consideration?:</label>
        <input type="text" id="ucond" name="ucond" maxlength="1000"> <br><br>

        <button type="submit" > Register</button>

    </form>
